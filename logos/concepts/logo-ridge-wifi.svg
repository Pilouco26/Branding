<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="rw-title">
  <title id="rw-title">Piricodi</title>
  <defs>
    <linearGradient id="rw-mid" x1="9" y1="9" x2="12" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3E8E74"/>
      <stop offset="1" stop-color="#1D5646"/>
    </linearGradient>
    <linearGradient id="rw-shade" x1="21" y1="7" x2="24" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#255F4E"/>
      <stop offset="1" stop-color="#0F2B24"/>
    </linearGradient>
    <clipPath id="rw-gap">
      <path d="M11 9 L21 7 L16 19 Z"/>
    </clipPath>
  </defs>
  <!-- left peak -->
  <path fill="url(#rw-mid)" d="M3 27 L11 9 L16 19 V27 Z"/>
  <!-- right peak -->
  <path fill="url(#rw-shade)" d="M16 19 L21 7 L29 27 H16 Z"/>
  <!-- wifi signal in the gap (replaces snow) -->
  <g clip-path="url(#rw-gap)" fill="none" stroke="#F4FAF7" stroke-width="1.3" stroke-linecap="round" opacity="0.95">
    <path d="M13.5 15 A 2.5 2.5 0 0 1 18.5 15"/>
    <path d="M11.5 15 A 4.5 4.5 0 0 1 20.5 15"/>
  </g>
  <circle cx="16" cy="15" r="1" fill="#F4FAF7"/>
</svg>
